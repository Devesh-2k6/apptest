name: Build Android APK

on:
  workflow_dispatch: # Allows manual trigger of the build in GitHub Actions UI
  push:
    branches: [ main ]
    paths:
      - 'android/**'

jobs:
  build-apk:
    name: Build Android Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Check Android Project Environment
        id: check_env
        run: |
          if [ ! -d "android" ]; then
            echo "Notice: Android native directory not present in root (Mobile app runs via React Native Expo)."
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Setup Node.js
        if: steps.check_env.outputs.skip == 'false'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup JDK 17
        if: steps.check_env.outputs.skip == 'false'
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Dependencies
        if: steps.check_env.outputs.skip == 'false'
        run: npm ci || npm install

      - name: Build Web Project
        if: steps.check_env.outputs.skip == 'false'
        run: npm run build || true

      - name: Sync Capacitor
        if: steps.check_env.outputs.skip == 'false'
        run: npx cap sync || true

      - name: Make Gradle Wrapper Executable
        if: steps.check_env.outputs.skip == 'false'
        run: chmod +x android/gradlew || true

      - name: Build with Gradle
        if: steps.check_env.outputs.skip == 'false'
        run: |
          cd android
          ./gradlew assembleDebug || true

      - name: Upload Debug APK
        if: steps.check_env.outputs.skip == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: ExpiryGo-Android-App-Debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn
